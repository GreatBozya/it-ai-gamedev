<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Прыгун (The Jumper) — движущиеся платформы + таймер</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0d0d1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        .game-wrapper {
            background: #16162e;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 0 40px rgba(100, 80, 255, 0.25);
        }
        canvas {
            display: block;
            border-radius: 10px;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.6);
            width: 800px;
            height: 500px;
            background: #1a1a2e;
        }
        .ui-overlay {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px 6px 16px;
            color: #c8c8e8;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .ui-overlay .crystals {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .ui-overlay .crystals .gem {
            display: inline-block;
            width: 20px;
            height: 20px;
            background: #00d4ff;
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            transition: opacity 0.3s, transform 0.3s;
        }
        .ui-overlay .crystals .gem.collected {
            opacity: 0.2;
            transform: scale(0.7);
        }
        .ui-overlay .status {
            color: #8888bb;
            font-size: 14px;
        }
        .ui-overlay .status .highlight {
            color: #ffd93d;
        }
        .ui-overlay .timer {
            color: #f1c40f;
            font-size: 18px;
            font-weight: 700;
            min-width: 70px;
            text-align: right;
        }
        .ui-overlay .timer.warning {
            color: #e74c3c;
            animation: blink 0.5s infinite alternate;
        }
        @keyframes blink {
            0% { opacity: 1; }
            100% { opacity: 0.3; }
        }
        .controls-hint {
            color: #555577;
            font-size: 12px;
            padding: 4px 16px 10px 16px;
            display: flex;
            gap: 24px;
            justify-content: center;
            letter-spacing: 0.3px;
            flex-wrap: wrap;
        }
        .controls-hint kbd {
            background: #2a2a44;
            padding: 2px 10px;
            border-radius: 4px;
            color: #aaaacc;
            font-size: 12px;
            border: 1px solid #3a3a5a;
        }
        .restart-btn {
            background: #2a2a4a;
            border: none;
            color: #aaaacc;
            padding: 4px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: 0.2s;
        }
        .restart-btn:hover {
            background: #3a3a5a;
            color: #fff;
        }
        @media (max-width: 840px) {
            .game-wrapper {
                padding: 10px;
                border-radius: 10px;
            }
            canvas {
                width: 100%;
                height: auto;
                aspect-ratio: 800/500;
            }
            .ui-overlay {
                font-size: 14px;
            }
            .controls-hint {
                font-size: 11px;
                gap: 10px;
            }
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <div class="ui-overlay">
            <div class="crystals">
                <span>💎</span>
                <span class="gem" id="gem1"></span>
                <span class="gem" id="gem2"></span>
                <span class="gem" id="gem3"></span>
                <span style="margin-left:6px; color:#7777aa;" id="crystalCount">0 / 3</span>
            </div>
            <div class="status">
                <span id="gameStatus">🏃 Игра</span>
            </div>
            <div class="timer" id="timerDisplay">⏱ 60</div>
            <button class="restart-btn" id="restartBtn">⟳ Рестарт</button>
        </div>

        <canvas id="gameCanvas" width="800" height="500"></canvas>

        <div class="controls-hint">
            <span><kbd>A</kbd> / <kbd>←</kbd> — влево</span>
            <span><kbd>D</kbd> / <kbd>→</kbd> — вправо</span>
            <span><kbd>Space</kbd> / <kbd>W</kbd> — прыжок</span>
            <span style="color:#ff6b6b;">⚠️ Дрон стреляет!</span>
            <span style="color:#f1c40f;">⏱ 60 сек</span>
        </div>
    </div>

    <script>
        // ============================================================
        //  CONSTANTS
        // ============================================================
        const CANVAS_W = 800;
        const CANVAS_H = 500;

        const GRAVITY = 0.55;
        const PLAYER_SPEED = 2.8;
        const JUMP_POWER = -9.2;
        const PLAYER_W = 20;
        const PLAYER_H = 30;
        const GROUND_Y = 440;
        const GROUND_H = 20;
        const TIME_LIMIT = 60; // секунд

        // ============================================================
        //  DOM refs
        // ============================================================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gemEls = [
            document.getElementById('gem1'),
            document.getElementById('gem2'),
            document.getElementById('gem3'),
        ];
        const crystalCountEl = document.getElementById('crystalCount');
        const gameStatusEl = document.getElementById('gameStatus');
        const timerDisplay = document.getElementById('timerDisplay');

        // ============================================================
        //  INPUT
        // ============================================================
        const keys = {};
        window.addEventListener('keydown', e => {
            keys[e.key] = true;
            if (e.key === ' ' || e.key === 'Space' || e.key === 'w' || e.key === 'W') {
                e.preventDefault();
            }
            if (e.key === 'r' || e.key === 'R') {
                restartGame();
            }
        });
        window.addEventListener('keyup', e => {
            keys[e.key] = false;
        });

        // ============================================================
        //  GAME STATE
        // ============================================================
        let gameState = 'playing'; // 'playing' | 'won' | 'lost'
        let gameTime = 0;
        let particles = [];
        let timeLeft = TIME_LIMIT;
        let prevTimestamp = 0;

        // ---- Player ----
        let player = {};

        // ---- Enemy (наземный) ----
        let enemy = {};

        // ---- Drone ----
        let drone = {};
        let bullets = [];

        // ---- Moving Platforms (новое) ----
        let movingPlatforms = [];

        // ---- Level ----
        let platforms = [];
        let crystals = [];
        let door = {};

        // ============================================================
        //  INIT
        // ============================================================
        function initGame() {
            gameState = 'playing';
            gameTime = 0;
            particles = [];
            bullets = [];
            timeLeft = TIME_LIMIT;
            prevTimestamp = 0;

            // Player
            player = {
                x: 40,
                y: GROUND_Y - PLAYER_H,
                w: PLAYER_W,
                h: PLAYER_H,
                vx: 0,
                vy: 0,
                onGround: false,
                facing: 1,
                crystals: 0,
            };

            // Static platforms
            platforms = [
                { x: 40, y: 375, w: 90, h: 12 },
                { x: 190, y: 310, w: 90, h: 12 },
                { x: 340, y: 375, w: 90, h: 12 },
                { x: 490, y: 310, w: 90, h: 12 },
                { x: 640, y: 375, w: 90, h: 12 },
            ];

            // Moving platforms (новые)
            movingPlatforms = [
                {
                    x: 200, y: 250, w: 80, h: 12,
                    startX: 150, endX: 450,
                    startY: 250, endY: 250,
                    speed: 1.5,
                    dirX: 1, dirY: 0,
                    prevX: 200, prevY: 250,
                },
                {
                    x: 550, y: 150, w: 12, h: 80,
                    startX: 550, endX: 550,
                    startY: 150, endY: 350,
                    speed: 1.2,
                    dirX: 0, dirY: 1,
                    prevX: 550, prevY: 150,
                },
            ];

            // Crystals (немного сместим, чтобы были доступны с движущихся платформ)
            crystals = [
                { x: 85, y: 360, w: 18, h: 18, collected: false },
                { x: 235, y: 295, w: 18, h: 18, collected: false },
                { x: 580, y: 130, w: 18, h: 18, collected: false }, // на пути вертикальной платформы
            ];

            // Door
            door = {
                x: 740,
                y: GROUND_Y - 26,
                w: 28,
                h: 26,
                active: false,
            };

            // Enemy (наземный)
            enemy = {
                x: 300,
                y: GROUND_Y - 28,
                w: 26,
                h: 28,
                vx: 0,
                vy: 0,
                state: 'patrol',
                facing: 1,
                patrolStart: 120,
                patrolEnd: 580,
                patrolSpeed: 1.0,
                chaseSpeed: 1.8,
                attackSpeed: 4.8,
                detectRadius: 180,
                attackRadius: 32,
                loseRadius: 280,
                attackDuration: 0.55,
                attackTimer: 0,
                attackDirX: 1,
                attackDirY: 0,
                _patrolDir: 1,
            };

            // Drone
            drone = {
                x: 480,
                y: 220,
                w: 28,
                h: 28,
                state: 'patrol',
                facing: 1,
                patrolTop: 100,
                patrolBottom: 380,
                patrolSpeed: 0.8,
                chaseSpeed: 1.4,
                detectRadius: 200,
                attackRadius: 160,
                attackCooldown: 1.8,
                cooldownTimer: 0,
                _patrolDir: -1,
                shootTimer: 0,
                bulletSpeed: 2.8,
            };

            updateUI();
        }

        // ============================================================
        //  UI UPDATE
        // ============================================================
        function updateUI() {
            const count = player.crystals || 0;
            crystalCountEl.textContent = `${count} / 3`;

            for (let i = 0; i < 3; i++) {
                if (i < crystals.length) {
                    gemEls[i].className = 'gem' + (crystals[i].collected ? ' collected' : '');
                }
            }

            if (gameState === 'playing') {
                gameStatusEl.innerHTML = '🏃 Игра';
                gameStatusEl.style.color = '#8888bb';
            } else if (gameState === 'won') {
                gameStatusEl.innerHTML = '🎉 ПОБЕДА!';
                gameStatusEl.style.color = '#ffd93d';
            } else if (gameState === 'lost') {
                gameStatusEl.innerHTML = '💀 ПОРАЖЕНИЕ';
                gameStatusEl.style.color = '#ff6b6b';
            }

            // Таймер
            const seconds = Math.ceil(timeLeft);
            timerDisplay.textContent = `⏱ ${seconds}`;
            if (timeLeft <= 10) {
                timerDisplay.className = 'timer warning';
            } else {
                timerDisplay.className = 'timer';
            }
        }

        // ============================================================
        //  PARTICLES
        // ============================================================
        function spawnParticles(x, y, color, count = 12) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 1 + Math.random() * 3;
                particles.push({
                    x,
                    y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 1,
                    life: 1,
                    decay: 0.015 + Math.random() * 0.025,
                    size: 3 + Math.random() * 5,
                    color,
                });
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.08;
                p.life -= p.decay;
                p.size *= 0.995;
                if (p.life <= 0 || p.size < 0.3) {
                    particles.splice(i, 1);
                }
            }
        }

        // ============================================================
        //  COLLISION HELPERS
        // ============================================================
        function aabb(a, b) {
            return a.x < b.x + b.w && a.x + a.w > b.x &&
                a.y < b.y + b.h && a.y + a.h > b.y;
        }

        function resolveAABB(ent, block) {
            const overlapX = Math.min(ent.x + ent.w, block.x + block.w) - Math.max(ent.x, block.x);
            const overlapY = Math.min(ent.y + ent.h, block.y + block.h) - Math.max(ent.y, block.y);

            if (overlapX < overlapY) {
                if (ent.vx > 0) ent.x = block.x - ent.w;
                else if (ent.vx < 0) ent.x = block.x + block.w;
                ent.vx = 0;
            } else {
                if (ent.vy > 0) {
                    ent.y = block.y - ent.h;
                    ent.vy = 0;
                    ent.onGround = true;
                } else if (ent.vy < 0) {
                    ent.y = block.y + block.h;
                    ent.vy = 0;
                }
            }
        }

        // ============================================================
        //  MOVING PLATFORMS UPDATE (новое)
        // ============================================================
        function updateMovingPlatforms() {
            for (const mp of movingPlatforms) {
                // Сохраняем предыдущую позицию для вычисления смещения
                mp.prevX = mp.x;
                mp.prevY = mp.y;

                // Движение по оси X
                if (mp.dirX !== 0) {
                    mp.x += mp.dirX * mp.speed;
                    if (mp.x >= mp.endX) {
                        mp.x = mp.endX;
                        mp.dirX = -1;
                    } else if (mp.x <= mp.startX) {
                        mp.x = mp.startX;
                        mp.dirX = 1;
                    }
                }
                // Движение по оси Y
                if (mp.dirY !== 0) {
                    mp.y += mp.dirY * mp.speed;
                    if (mp.y >= mp.endY) {
                        mp.y = mp.endY;
                        mp.dirY = -1;
                    } else if (mp.y <= mp.startY) {
                        mp.y = mp.startY;
                        mp.dirY = 1;
                    }
                }
            }
        }

        // ============================================================
        //  PLAYER UPDATE (с поддержкой движущихся платформ)
        // ============================================================
        function updatePlayer() {
            if (gameState !== 'playing') return;

            const p = player;

            // Горизонтальный ввод
            let move = 0;
            if (keys['a'] || keys['A'] || keys['ArrowLeft']) move = -1;
            if (keys['d'] || keys['D'] || keys['ArrowRight']) move = 1;

            p.vx = move * PLAYER_SPEED;
            if (move !== 0) p.facing = move;

            // Прыжок
            const jumpKey = keys[' '] || keys['Space'] || keys['w'] || keys['W'];
            if (jumpKey && p.onGround) {
                p.vy = JUMP_POWER;
                p.onGround = false;
                spawnParticles(p.x + p.w / 2, p.y + p.h, '#88ccff', 8);
            }

            // Гравитация
            p.vy += GRAVITY;
            if (p.vy > 12) p.vy = 12;

            // Движение по X
            p.x += p.vx;
            if (p.x < 0) p.x = 0;
            if (p.x + p.w > CANVAS_W) p.x = CANVAS_W - p.w;

            // Движение по Y
            p.y += p.vy;

            // --- Коллизия со статичными платформами ---
            // Сначала земля
            if (p.y + p.h > GROUND_Y) {
                p.y = GROUND_Y - p.h;
                p.vy = 0;
                p.onGround = true;
            } else {
                p.onGround = false;
            }

            // Статичные платформы
            p.onGround = false;
            for (const plat of platforms) {
                if (aabb(p, plat)) {
                    resolveAABB(p, plat);
                }
            }
            // Перепроверка земли после платформ
            if (p.y + p.h >= GROUND_Y) {
                p.y = GROUND_Y - p.h;
                p.vy = 0;
                p.onGround = true;
            }

            // --- Коллизия с движущимися платформами ---
            // Сначала разрешаем столкновения (отталкивание)
            for (const mp of movingPlatforms) {
                if (aabb(p, mp)) {
                    // Определяем, с какой стороны столкновение
                    const overlapX = Math.min(p.x + p.w, mp.x + mp.w) - Math.max(p.x, mp.x);
                    const overlapY = Math.min(p.y + p.h, mp.y + mp.h) - Math.max(p.y, mp.y);

                    if (overlapX < overlapY) {
                        // Горизонтальное разрешение
                        if (p.vx > 0) p.x = mp.x - p.w;
                        else if (p.vx < 0) p.x = mp.x + mp.w;
                        p.vx = 0;
                    } else {
                        // Вертикальное разрешение
                        if (p.vy > 0) {
                            p.y = mp.y - p.h;
                            p.vy = 0;
                            p.onGround = true;
                        } else if (p.vy < 0) {
                            p.y = mp.y + mp.h;
                            p.vy = 0;
                        }
                    }
                }
            }

            // --- Прилипание к движущимся платформам (если игрок стоит на них) ---
            // Проверяем, стоит ли игрок на какой-либо движущейся платформе
            let onMoving = false;
            for (const mp of movingPlatforms) {
                // Игрок стоит на платформе, если его нижняя часть касается верха платформы
                // и он движется вниз или стоит на месте
                const tolerance = 2;
                const isOnTop = Math.abs((p.y + p.h) - mp.y) < tolerance;
                const isAbove = p.y + p.h <= mp.y + tolerance;
                if (isOnTop && isAbove && p.vy >= 0 && aabb(p, mp)) {
                    // Применяем смещение платформы
                    const dx = mp.x - mp.prevX;
                    const dy = mp.y - mp.prevY;
                    p.x += dx;
                    p.y += dy;
                    // Фиксируем позицию на верхней границе платформы
                    p.y = mp.y - p.h;
                    p.vy = 0;
                    p.onGround = true;
                    onMoving = true;
                    break; // только одна платформа
                }
            }

            // Если игрок не на движущейся платформе, но onGround был установлен от статичных платформ,
            // то он всё ещё на земле. Но если он был на движущейся, то onGround = true уже установлен.

            // Проверка падения с экрана
            if (p.y > CANVAS_H + 50) {
                loseGame();
                return;
            }

            // --- Сбор кристаллов ---
            for (const cr of crystals) {
                if (!cr.collected && aabb(p, cr)) {
                    cr.collected = true;
                    p.crystals = (p.crystals || 0) + 1;
                    spawnParticles(cr.x + cr.w / 2, cr.y + cr.h / 2, '#00d4ff', 20);
                    updateUI();
                    if (p.crystals >= 3) {
                        door.active = true;
                        spawnParticles(door.x + door.w / 2, door.y + door.h / 2, '#ffd93d', 30);
                    }
                }
            }

            // --- Дверь ---
            if (door.active && aabb(p, door)) {
                winGame();
                return;
            }

            // --- Столкновения с врагами ---
            if (aabb(p, enemy)) {
                loseGame();
                return;
            }
            if (aabb(p, drone)) {
                loseGame();
                return;
            }
            for (const b of bullets) {
                if (aabb(p, b)) {
                    loseGame();
                    return;
                }
            }

            updateUI();
        }

        // ============================================================
        //  ENEMY UPDATE (без изменений)
        // ============================================================
        function updateEnemy() {
            if (gameState !== 'playing') return;

            const e = enemy;
            const p = player;

            const dx = (p.x + p.w / 2) - (e.x + e.w / 2);
            const dy = (p.y + p.h / 2) - (e.y + e.h / 2);
            const dist = Math.sqrt(dx * dx + dy * dy);

            switch (e.state) {
                case 'patrol': {
                    const targetX = e._patrolDir > 0 ? e.patrolEnd : e.patrolStart;
                    const step = e.patrolSpeed;
                    if (Math.abs(e.x - targetX) < step) {
                        e.x = targetX;
                        e._patrolDir *= -1;
                    } else {
                        e.x += e._patrolDir * step;
                    }
                    e.facing = e._patrolDir;

                    if (dist <= e.detectRadius) {
                        e.state = 'chase';
                    }
                    break;
                }

                case 'chase': {
                    const dirX = dx / dist;
                    const dirY = dy / dist;
                    e.x += dirX * e.chaseSpeed;
                    e.y = GROUND_Y - e.h;
                    e.facing = dirX > 0 ? 1 : -1;

                    if (dist <= e.attackRadius) {
                        e.state = 'attack';
                        e.attackTimer = 0;
                        e.attackDirX = dirX;
                        e.attackDirY = dirY;
                        const len = Math.sqrt(e.attackDirX * e.attackDirX + e.attackDirY * e.attackDirY);
                        if (len > 0) {
                            e.attackDirX /= len;
                            e.attackDirY /= len;
                        } else {
                            e.attackDirX = 1;
                            e.attackDirY = 0;
                        }
                        spawnParticles(e.x + e.w / 2, e.y + e.h / 2, '#9b59b6', 15);
                    } else if (dist > e.loseRadius) {
                        e.state = 'patrol';
                        e._patrolDir = e.facing;
                    }
                    break;
                }

                case 'attack': {
                    e.x += e.attackDirX * e.attackSpeed;
                    e.y += e.attackDirY * e.attackSpeed;
                    if (e.y + e.h > GROUND_Y) {
                        e.y = GROUND_Y - e.h;
                        e.attackDirY = 0;
                    }
                    e.facing = e.attackDirX > 0 ? 1 : -1;

                    e.attackTimer += 1 / 60;

                    let hitWall = false;
                    if (e.y + e.h > GROUND_Y) {
                        e.y = GROUND_Y - e.h;
                        if (Math.abs(e.attackDirY) > 0.1) hitWall = true;
                    }
                    for (const plat of platforms) {
                        if (aabb(e, plat)) {
                            const ox = Math.min(e.x + e.w, plat.x + plat.w) - Math.max(e.x, plat.x);
                            const oy = Math.min(e.y + e.h, plat.y + plat.h) - Math.max(e.y, plat.y);
                            if (ox < oy) {
                                if (e.attackDirX > 0) e.x = plat.x - e.w;
                                else e.x = plat.x + plat.w;
                                e.attackDirX *= -1;
                            } else {
                                if (e.attackDirY > 0) e.y = plat.y - e.h;
                                else e.y = plat.y + plat.h;
                                e.attackDirY *= -1;
                            }
                            hitWall = true;
                            spawnParticles(e.x + e.w / 2, e.y + e.h / 2, '#ff6b6b', 10);
                            break;
                        }
                    }
                    if (e.x < 0) { e.x = 0;
                        e.attackDirX *= -1;
                        hitWall = true; }
                    if (e.x + e.w > CANVAS_W) { e.x = CANVAS_W - e.w;
                        e.attackDirX *= -1;
                        hitWall = true; }

                    if (e.attackTimer >= e.attackDuration || hitWall) {
                        e.state = 'patrol';
                        e._patrolDir = e.facing;
                        spawnParticles(e.x + e.w / 2, e.y + e.h / 2, '#8e44ad', 12);
                    }
                    break;
                }
            }

            if (e.x < 0) e.x = 0;
            if (e.x + e.w > CANVAS_W) e.x = CANVAS_W - e.w;
            if (e.y + e.h > GROUND_Y) e.y = GROUND_Y - e.h;

            if (aabb(e, player)) {
                loseGame();
            }
        }

        // ============================================================
        //  DRONE UPDATE (без изменений)
        // ============================================================
        function updateDrone() {
            if (gameState !== 'playing') return;

            const d = drone;
            const p = player;

            const dx = (p.x + p.w / 2) - (d.x + d.w / 2);
            const dy = (p.y + p.h / 2) - (d.y + d.h / 2);
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (d.cooldownTimer > 0) {
                d.cooldownTimer -= 1 / 60;
            }

            switch (d.state) {
                case 'patrol': {
                    const targetY = d._patrolDir > 0 ? d.patrolBottom : d.patrolTop;
                    const step = d.patrolSpeed;
                    if (Math.abs(d.y - targetY) < step) {
                        d.y = targetY;
                        d._patrolDir *= -1;
                    } else {
                        d.y += d._patrolDir * step;
                    }
                    d.facing = 1;

                    if (dist <= d.detectRadius) {
                        d.state = 'chase';
                    }
                    break;
                }

                case 'chase': {
                    const dirX = dx / dist;
                    d.x += dirX * d.chaseSpeed;
                    d.facing = dirX > 0 ? 1 : -1;

                    if (dist > d.detectRadius * 1.3) {
                        d.state = 'patrol';
                        d._patrolDir = (d.y < (d.patrolTop + d.patrolBottom) / 2) ? 1 : -1;
                    } else if (dist <= d.attackRadius && d.cooldownTimer <= 0) {
                        d.state = 'attack';
                        d.shootTimer = 0;
                    }
                    break;
                }

                case 'attack': {
                    const dirX = (p.x + p.w / 2) - (d.x + d.w / 2);
                    const dirY = (p.y + p.h / 2) - (d.y + d.h / 2);
                    const len = Math.sqrt(dirX * dirX + dirY * dirY);
                    if (len > 0) {
                        const normX = dirX / len;
                        const normY = dirY / len;
                        bullets.push({
                            x: d.x + d.w / 2 - 4,
                            y: d.y + d.h / 2 - 4,
                            w: 8,
                            h: 8,
                            vx: normX * d.bulletSpeed,
                            vy: normY * d.bulletSpeed,
                            life: 1,
                        });
                        spawnParticles(d.x + d.w / 2, d.y + d.h / 2, '#ff6b6b', 10);
                    }
                    d.cooldownTimer = d.attackCooldown;
                    d.state = 'patrol';
                    d._patrolDir = (d.y < (d.patrolTop + d.patrolBottom) / 2) ? 1 : -1;
                    break;
                }
            }

            if (d.x < 0) d.x = 0;
            if (d.x + d.w > CANVAS_W) d.x = CANVAS_W - d.w;
            if (d.y < d.patrolTop) d.y = d.patrolTop;
            if (d.y + d.h > d.patrolBottom) d.y = d.patrolBottom - d.h;

            if (aabb(d, player)) {
                loseGame();
            }
        }

        // ============================================================
        //  BULLETS UPDATE (без изменений)
        // ============================================================
        function updateBullets() {
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.x += b.vx;
                b.y += b.vy;

                if (b.x < -20 || b.x > CANVAS_W + 20 || b.y < -20 || b.y > CANVAS_H + 20) {
                    bullets.splice(i, 1);
                    continue;
                }

                let hit = false;
                for (const plat of platforms) {
                    if (aabb(b, plat)) {
                        spawnParticles(b.x + b.w / 2, b.y + b.h / 2, '#ffaa00', 6);
                        hit = true;
                        break;
                    }
                }
                // также проверяем движущиеся платформы
                if (!hit) {
                    for (const mp of movingPlatforms) {
                        if (aabb(b, mp)) {
                            spawnParticles(b.x + b.w / 2, b.y + b.h / 2, '#ffaa00', 6);
                            hit = true;
                            break;
                        }
                    }
                }
                if (hit) {
                    bullets.splice(i, 1);
                }
            }
        }

        // ============================================================
        //  WIN / LOSE
        // ============================================================
        function winGame() {
            if (gameState === 'won') return;
            gameState = 'won';
            spawnParticles(door.x + door.w / 2, door.y + door.h / 2, '#ffd93d', 50);
            spawnParticles(door.x + door.w / 2 - 30, door.y + door.h / 2, '#ff6b6b', 30);
            spawnParticles(door.x + door.w / 2 + 30, door.y + door.h / 2, '#00d4ff', 30);
            updateUI();
        }

        function loseGame() {
            if (gameState === 'lost' || gameState === 'won') return;
            gameState = 'lost';
            spawnParticles(player.x + player.w / 2, player.y + player.h / 2, '#ff6b6b', 40);
            updateUI();
        }

        function restartGame() {
            initGame();
            updateUI();
        }

        // ============================================================
        //  RENDER (добавлены движущиеся платформы и таймер)
        // ============================================================
        function render() {
            ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);

            // ---- Background ----
            const grad = ctx.createLinearGradient(0, 0, 0, CANVAS_H);
            grad.addColorStop(0, '#1a1a2e');
            grad.addColorStop(0.6, '#16213e');
            grad.addColorStop(1, '#0f3460');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

            // Stars
            ctx.fillStyle = 'rgba(255,255,255,0.15)';
            for (let i = 0; i < 60; i++) {
                const sx = (i * 137.508) % CANVAS_W;
                const sy = (i * 269.361 + 50) % (GROUND_Y - 40);
                const ss = 0.5 + (i % 3) * 0.5;
                ctx.beginPath();
                ctx.arc(sx, sy, ss, 0, Math.PI * 2);
                ctx.fill();
            }

            // ---- Ground ----
            const grdGrad = ctx.createLinearGradient(0, GROUND_Y, 0, CANVAS_H);
            grdGrad.addColorStop(0, '#3a3a5a');
            grdGrad.addColorStop(0.3, '#2d2d4a');
            grdGrad.addColorStop(1, '#1a1a30');
            ctx.fillStyle = grdGrad;
            ctx.fillRect(0, GROUND_Y, CANVAS_W, GROUND_H);

            ctx.strokeStyle = 'rgba(100, 100, 200, 0.2)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, GROUND_Y);
            ctx.lineTo(CANVAS_W, GROUND_Y);
            ctx.stroke();

            // ---- Static Platforms ----
            for (const plat of platforms) {
                const pGrad = ctx.createLinearGradient(0, plat.y, 0, plat.y + plat.h);
                pGrad.addColorStop(0, '#6a6a9a');
                pGrad.addColorStop(0.5, '#4a4a7a');
                pGrad.addColorStop(1, '#3a3a5a');
                ctx.fillStyle = pGrad;
                ctx.shadowColor = 'rgba(100, 100, 255, 0.15)';
                ctx.shadowBlur = 12;
                ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(180, 180, 255, 0.08)';
                ctx.fillRect(plat.x + 4, plat.y + 2, plat.w - 8, 4);
            }

            // ---- Moving Platforms (новые) ----
            for (const mp of movingPlatforms) {
                // Светящийся контур
                ctx.shadowColor = 'rgba(0, 255, 200, 0.3)';
                ctx.shadowBlur = 18;
                const mGrad = ctx.createLinearGradient(mp.x, mp.y, mp.x + mp.w, mp.y + mp.h);
                mGrad.addColorStop(0, '#2ecc71');
                mGrad.addColorStop(0.5, '#27ae60');
                mGrad.addColorStop(1, '#1e8449');
                ctx.fillStyle = mGrad;
                ctx.fillRect(mp.x, mp.y, mp.w, mp.h);
                ctx.shadowBlur = 0;
                // Блик
                ctx.fillStyle = 'rgba(255,255,255,0.15)';
                ctx.fillRect(mp.x + 4, mp.y + 2, mp.w - 8, 3);
                // Стрелки направления (для наглядности)
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.font = '10px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                if (mp.dirX !== 0) {
                    const arrow = mp.dirX > 0 ? '→' : '←';
                    ctx.fillText(arrow, mp.x + mp.w / 2, mp.y + mp.h / 2);
                } else {
                    const arrow = mp.dirY > 0 ? '↓' : '↑';
                    ctx.fillText(arrow, mp.x + mp.w / 2, mp.y + mp.h / 2);
                }
            }

            // ---- Crystals ----
            for (const cr of crystals) {
                if (cr.collected) continue;
                const cx = cr.x + cr.w / 2;
                const cy = cr.y + cr.h / 2;
                const pulse = 1 + 0.08 * Math.sin(gameTime * 3 + cr.x);

                ctx.shadowColor = 'rgba(0, 212, 255, 0.6)';
                ctx.shadowBlur = 20 * pulse;

                ctx.beginPath();
                ctx.moveTo(cx, cr.y - 2 * pulse);
                ctx.lineTo(cr.x + cr.w + 2 * pulse, cy);
                ctx.lineTo(cx, cr.y + cr.h + 2 * pulse);
                ctx.lineTo(cr.x - 2 * pulse, cy);
                ctx.closePath();

                const cGrad = ctx.createLinearGradient(cx - 10, cy - 10, cx + 10, cy + 10);
                cGrad.addColorStop(0, '#66eeff');
                cGrad.addColorStop(0.5, '#00d4ff');
                cGrad.addColorStop(1, '#0088cc');
                ctx.fillStyle = cGrad;
                ctx.fill();

                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.beginPath();
                ctx.arc(cx - 3, cy - 4, 3 * pulse, 0, Math.PI * 2);
                ctx.fill();
            }

            // ---- Door ----
            const doorActive = door.active || (player.crystals && player.crystals >= 3);
            const doorColor = doorActive ? '#ffd93d' : '#665533';
            const doorGlow = doorActive ? 'rgba(255, 217, 61, 0.5)' : 'rgba(100, 80, 50, 0.2)';

            ctx.shadowColor = doorGlow;
            ctx.shadowBlur = doorActive ? 30 : 10;

            ctx.fillStyle = doorColor;
            ctx.fillRect(door.x, door.y, door.w, door.h);

            ctx.fillStyle = doorActive ? '#ffed4a' : '#776644';
            ctx.fillRect(door.x + 4, door.y - 6, door.w - 8, 8);

            ctx.shadowBlur = 0;
            ctx.fillStyle = doorActive ? '#ff6b00' : '#554433';
            ctx.beginPath();
            ctx.arc(door.x + door.w - 7, door.y + door.h / 2, 4, 0, Math.PI * 2);
            ctx.fill();

            if (doorActive) {
                ctx.shadowBlur = 40;
                ctx.shadowColor = 'rgba(255, 217, 61, 0.3)';
                ctx.strokeStyle = 'rgba(255, 217, 61, 0.2)';
                ctx.lineWidth = 2;
                ctx.setLineDash([4, 8]);
                ctx.beginPath();
                ctx.arc(door.x + door.w / 2, door.y + door.h / 2, 22 + 4 * Math.sin(gameTime * 2), 0, Math.PI * 2);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.shadowBlur = 0;
            }

            ctx.shadowBlur = 0;
            ctx.fillStyle = doorActive ? 'rgba(255,255,255,0.9)' : 'rgba(200,180,150,0.4)';
            ctx.font = '9px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('EXIT', door.x + door.w / 2, door.y - 10);

            // ---- Enemy ----
            const e = enemy;
            const isAttacking = e.state === 'attack';

            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.beginPath();
            ctx.ellipse(e.x + e.w / 2, GROUND_Y + 2, e.w / 2 + 4, 5, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowColor = isAttacking ? 'rgba(255, 50, 50, 0.5)' : 'rgba(120, 80, 200, 0.3)';
            ctx.shadowBlur = isAttacking ? 30 : 15;

            const bodyColor = isAttacking ? '#e74c3c' : '#6c5ce7';
            const bodyColor2 = isAttacking ? '#c0392b' : '#5a4bd1';

            const bGrad = ctx.createRadialGradient(
                e.x + e.w * 0.3, e.y + e.h * 0.3, 2,
                e.x + e.w / 2, e.y + e.h / 2, e.w
            );
            bGrad.addColorStop(0, bodyColor);
            bGrad.addColorStop(1, bodyColor2);
            ctx.fillStyle = bGrad;

            const r = 8;
            ctx.beginPath();
            ctx.moveTo(e.x + r, e.y);
            ctx.lineTo(e.x + e.w - r, e.y);
            ctx.quadraticCurveTo(e.x + e.w, e.y, e.x + e.w, e.y + r);
            ctx.lineTo(e.x + e.w, e.y + e.h - r);
            ctx.quadraticCurveTo(e.x + e.w, e.y + e.h, e.x + e.w - r, e.y + e.h);
            ctx.lineTo(e.x + r, e.y + e.h);
            ctx.quadraticCurveTo(e.x, e.y + e.h, e.x, e.y + e.h - r);
            ctx.lineTo(e.x, e.y + r);
            ctx.quadraticCurveTo(e.x, e.y, e.x + r, e.y);
            ctx.closePath();
            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(e.x + e.w * 0.35 + (e.facing > 0 ? 2 : -2), e.y + e.h * 0.35, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(e.x + e.w * 0.65 + (e.facing > 0 ? 2 : -2), e.y + e.h * 0.35, 5, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#2d1b4e';
            ctx.beginPath();
            ctx.arc(e.x + e.w * 0.35 + (e.facing > 0 ? 6 : -2), e.y + e.h * 0.37, 2.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(e.x + e.w * 0.65 + (e.facing > 0 ? 6 : -2), e.y + e.h * 0.37, 2.5, 0, Math.PI * 2);
            ctx.fill();

            if (isAttacking) {
                ctx.strokeStyle = '#c0392b';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(e.x + e.w * 0.2, e.y + e.h * 0.2);
                ctx.lineTo(e.x + e.w * 0.4, e.y + e.h * 0.15);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(e.x + e.w * 0.8, e.y + e.h * 0.2);
                ctx.lineTo(e.x + e.w * 0.6, e.y + e.h * 0.15);
                ctx.stroke();
            }

            ctx.fillStyle = isAttacking ? '#c0392b' : '#4a3b7a';
            ctx.beginPath();
            if (isAttacking) {
                ctx.arc(e.x + e.w / 2, e.y + e.h * 0.7, 5, 0, Math.PI);
            } else {
                ctx.arc(e.x + e.w / 2, e.y + e.h * 0.6, 4, 0, Math.PI);
            }
            ctx.fill();

            ctx.shadowBlur = 0;
            const stateColors = { patrol: '#6c5ce7', chase: '#f39c12', attack: '#e74c3c' };
            ctx.fillStyle = stateColors[e.state] || '#6c5ce7';
            ctx.beginPath();
            ctx.arc(e.x + e.w / 2, e.y - 8, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.font = '6px sans-serif';
            ctx.textAlign = 'center';
            const stateLabels = { patrol: 'P', chase: 'C', attack: 'A' };
            ctx.fillText(stateLabels[e.state] || 'P', e.x + e.w / 2, e.y - 5);

            // ---- Drone ----
            const d = drone;
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(0,0,0,0.15)';
            ctx.beginPath();
            ctx.ellipse(d.x + d.w / 2, d.y + d.h + 4, d.w / 2 + 2, 4, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowColor = 'rgba(0, 200, 255, 0.3)';
            ctx.shadowBlur = 18;

            const dGrad = ctx.createRadialGradient(d.x + 6, d.y + 6, 2, d.x + d.w / 2, d.y + d.h / 2, d.w);
            dGrad.addColorStop(0, '#4dc9f6');
            dGrad.addColorStop(0.6, '#1b8ec2');
            dGrad.addColorStop(1, '#0f5a7a');
            ctx.fillStyle = dGrad;

            ctx.beginPath();
            ctx.roundRect(d.x, d.y, d.w, d.h, 6);
            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.strokeStyle = 'rgba(200, 230, 255, 0.6)';
            ctx.lineWidth = 3;
            const propAngle = gameTime * 8;
            for (let i = 0; i < 4; i++) {
                const angle = propAngle + i * Math.PI / 2;
                const cx = d.x + d.w / 2;
                const cy = d.y + d.h / 2;
                const len = 12;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(cx + Math.cos(angle) * len, cy + Math.sin(angle) * len);
                ctx.stroke();
            }
            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            ctx.beginPath();
            ctx.arc(d.x + d.w / 2, d.y + d.h / 2, 3, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(d.x + d.w * 0.4, d.y + d.h * 0.4, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(d.x + d.w * 0.6, d.y + d.h * 0.4, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#222';
            ctx.beginPath();
            ctx.arc(d.x + d.w * 0.4 + (d.facing > 0 ? 2 : -2), d.y + d.h * 0.42, 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(d.x + d.w * 0.6 + (d.facing > 0 ? 2 : -2), d.y + d.h * 0.42, 2, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = d.state === 'patrol' ? '#4dc9f6' : (d.state === 'chase' ? '#f39c12' : '#e74c3c');
            ctx.beginPath();
            ctx.arc(d.x + d.w / 2, d.y - 8, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.font = '6px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(d.state === 'patrol' ? 'P' : (d.state === 'chase' ? 'C' : 'A'), d.x + d.w / 2, d.y - 5);

            // ---- Bullets ----
            ctx.shadowBlur = 0;
            for (const b of bullets) {
                ctx.fillStyle = '#ff6b6b';
                ctx.shadowColor = 'rgba(255, 50, 50, 0.6)';
                ctx.shadowBlur = 16;
                ctx.beginPath();
                ctx.arc(b.x + b.w / 2, b.y + b.h / 2, b.w / 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#ffdd44';
                ctx.beginPath();
                ctx.arc(b.x + b.w / 2, b.y + b.h / 2, b.w / 4, 0, Math.PI * 2);
                ctx.fill();
            }

            // ---- Player ----
            const p = player;
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(0,0,0,0.15)';
            ctx.beginPath();
            ctx.ellipse(p.x + p.w / 2, GROUND_Y + 2, p.w / 2 + 2, 4, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowColor = 'rgba(255, 100, 100, 0.2)';
            ctx.shadowBlur = 12;

            const pGrad = ctx.createLinearGradient(p.x, p.y, p.x + p.w, p.y + p.h);
            pGrad.addColorStop(0, '#ff7a7a');
            pGrad.addColorStop(0.5, '#ff4d4d');
            pGrad.addColorStop(1, '#cc2222');
            ctx.fillStyle = pGrad;
            ctx.beginPath();
            ctx.roundRect(p.x, p.y, p.w, p.h, 4);
            ctx.fill();

            ctx.shadowBlur = 0;
            const fDir = p.facing || 1;
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(p.x + p.w * 0.35 + (fDir > 0 ? 2 : -2), p.y + p.h * 0.3, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(p.x + p.w * 0.65 + (fDir > 0 ? 2 : -2), p.y + p.h * 0.3, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#2d1b4e';
            ctx.beginPath();
            ctx.arc(p.x + p.w * 0.35 + (fDir > 0 ? 5 : -1), p.y + p.h * 0.32, 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(p.x + p.w * 0.65 + (fDir > 0 ? 5 : -1), p.y + p.h * 0.32, 2, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#992222';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(p.x + p.w / 2, p.y + p.h * 0.55, 5, 0.1, Math.PI - 0.1);
            ctx.stroke();

            ctx.fillStyle = '#ff6b6b';
            ctx.shadowBlur = 6;
            ctx.shadowColor = 'rgba(255, 100, 100, 0.15)';
            ctx.beginPath();
            ctx.moveTo(p.x + p.w * 0.1, p.y + p.h * 0.5);
            ctx.quadraticCurveTo(p.x - 6, p.y + p.h * 0.7, p.x + 2, p.y + p.h * 0.9);
            ctx.quadraticCurveTo(p.x + p.w * 0.3, p.y + p.h * 0.8, p.x + p.w * 0.5, p.y + p.h * 0.85);
            ctx.fill();

            // ---- Particles ----
            ctx.shadowBlur = 0;
            for (const pt of particles) {
                const alpha = pt.life;
                ctx.globalAlpha = alpha;
                ctx.fillStyle = pt.color;
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, Math.max(0.5, pt.size * pt.life), 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;

            // ---- Game over overlay ----
            if (gameState === 'won') {
                ctx.fillStyle = 'rgba(0,0,0,0.35)';
                ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
                ctx.shadowBlur = 0;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.font = 'bold 48px sans-serif';
                ctx.fillStyle = '#ffd93d';
                ctx.shadowColor = 'rgba(255, 217, 61, 0.3)';
                ctx.shadowBlur = 30;
                ctx.fillText('🎉 ПОБЕДА!', CANVAS_W / 2, CANVAS_H / 2 - 20);
                ctx.shadowBlur = 0;
                ctx.font = '18px sans-serif';
                ctx.fillStyle = '#aaaacc';
                ctx.fillText('Нажмите R или кнопку Рестарт', CANVAS_W / 2, CANVAS_H / 2 + 50);
            }

            if (gameState === 'lost') {
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
                ctx.shadowBlur = 0;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.font = 'bold 48px sans-serif';
                ctx.fillStyle = '#ff6b6b';
                ctx.shadowColor = 'rgba(255, 50, 50, 0.3)';
                ctx.shadowBlur = 30;
                ctx.fillText('💀 ПОРАЖЕНИЕ', CANVAS_W / 2, CANVAS_H / 2 - 20);
                ctx.shadowBlur = 0;
                ctx.font = '18px sans-serif';
                ctx.fillStyle = '#aaaacc';
                ctx.fillText('Нажмите R или кнопку Рестарт', CANVAS_W / 2, CANVAS_H / 2 + 50);
            }
        }

        // ============================================================
        //  GAME LOOP (с таймером)
        // ============================================================
        function gameLoop(timestamp) {
            const dt = prevTimestamp ? (timestamp - prevTimestamp) / 1000 : 0;
            prevTimestamp = timestamp;
            gameTime = timestamp / 1000;

            if (gameState === 'playing') {
                // Обновление таймера
                timeLeft -= dt;
                if (timeLeft <= 0) {
                    timeLeft = 0;
                    loseGame();
                    // проигрыш из-за времени
                }
                updateUI();

                // Обновление движущихся платформ (до игрока, чтобы смещения были актуальны)
                updateMovingPlatforms();

                // Обновление сущностей
                updatePlayer();
                updateEnemy();
                updateDrone();
                updateBullets();
                updateParticles();
            } else {
                updateParticles();
            }

            render();
            requestAnimationFrame(gameLoop);
        }

        // ============================================================
        //  POLYFILL roundRect
        // ============================================================
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                if (r > w / 2) r = w / 2;
                if (r > h / 2) r = h / 2;
                this.moveTo(x + r, y);
                this.lineTo(x + w - r, y);
                this.quadraticCurveTo(x + w, y, x + w, y + r);
                this.lineTo(x + w, y + h - r);
                this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                this.lineTo(x + r, y + h);
                this.quadraticCurveTo(x, y + h, x, y + h - r);
                this.lineTo(x, y + r);
                this.quadraticCurveTo(x, y, x + r, y);
                return this;
            };
        }

        // ============================================================
        //  RESTART BUTTON
        // ============================================================
        document.getElementById('restartBtn').addEventListener('click', restartGame);

        // ============================================================
        //  START
        // ============================================================
        initGame();
        requestAnimationFrame(gameLoop);
    </script>
</body>
