<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painter</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #14161a; color: #e6e8ec; overflow: hidden;
    -webkit-user-select: none; user-select: none;
  }

  .app { display: flex; height: 100vh; }

  /* ---------- Панель ---------- */
  .panel {
    width: 312px; flex: 0 0 312px; padding: 16px 16px 28px;
    background: #1b1e24; border-right: 1px solid #2a2f38;
    overflow-y: auto; scrollbar-width: thin;
  }
  .panel::-webkit-scrollbar { width: 8px; }
  .panel::-webkit-scrollbar-thumb { background: #333a45; border-radius: 4px; }

  .panel h1 {
    font-size: 18px; margin: 0 0 18px; letter-spacing: .5px;
    display: flex; align-items: center; gap: 8px;
  }
  .panel h1::before {
    content: ""; width: 10px; height: 10px; border-radius: 50%;
    background: linear-gradient(135deg, #6ea8ff, #b06eff);
  }
  .panel h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px;
    color: #7d8798; margin: 0 0 10px; font-weight: 600;
  }
  section { margin-bottom: 22px; }

  /* ---------- Кисти ---------- */
  .brushes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .brush {
    position: relative; padding: 8px 4px 6px; cursor: pointer;
    background: #232830; border: 1px solid #2f3641; border-radius: 10px;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    transition: .15s; color: #c9d1de; font: inherit;
  }
  .brush:hover { background: #2a303a; }
  .brush.active { border-color: #6ea8ff; box-shadow: 0 0 0 2px rgba(110,168,255,.25); }
  .brush .thumb {
    width: 100%; height: 46px; border-radius: 7px; background-color: #fff;
    background-repeat: no-repeat; background-position: center; background-size: 72%;
  }
  .brush .num { font-size: 11px; letter-spacing: .5px; }

  /* ---------- Ползунки ---------- */
  .ctrl { margin-bottom: 14px; }
  .ctrl .row {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 12.5px; color: #aab3c2; margin-bottom: 6px;
  }
  .ctrl .row output {
    font-variant-numeric: tabular-nums; color: #e6e8ec;
    background: #232830; padding: 1px 7px; border-radius: 6px; font-size: 11.5px;
  }
  input[type="range"] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 22px;
    background: transparent; cursor: pointer; margin: 0;
  }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 4px; border-radius: 3px; background: #333a45;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 15px; height: 15px; margin-top: -5.5px;
    border-radius: 50%; background: #6ea8ff; border: 2px solid #1b1e24;
    box-shadow: 0 0 0 1px #6ea8ff;
  }
  input[type="range"]::-moz-range-track { height: 4px; border-radius: 3px; background: #333a45; }
  input[type="range"]::-moz-range-thumb {
    width: 13px; height: 13px; border-radius: 50%; background: #6ea8ff;
    border: 2px solid #1b1e24;
  }

  /* ---------- Поля / фон ---------- */
  .field { display: flex; gap: 8px; align-items: center; margin-bottom: 9px; }
  .field label { font-size: 12.5px; color: #aab3c2; white-space: nowrap; }
  input[type="color"] {
    width: 46px; height: 32px; padding: 0; border: 1px solid #2f3641;
    border-radius: 8px; background: #232830; cursor: pointer;
  }
  input[type="url"], input[type="text"] {
    flex: 1; min-width: 0; height: 32px; padding: 0 10px; font: inherit; font-size: 12.5px;
    background: #232830; border: 1px solid #2f3641; border-radius: 8px;
    color: #e6e8ec; outline: none;
  }
  input[type="url"]:focus { border-color: #6ea8ff; }
  input[type="url"]::placeholder { color: #5c6675; }

  /* ---------- Кнопки ---------- */
  button {
    font: inherit; font-size: 13px; cursor: pointer; color: #dbe2ee;
    background: #262c35; border: 1px solid #333b47; border-radius: 9px;
    padding: 9px 12px; transition: .15s;
  }
  button:hover { background: #2f3642; }
  button:active { transform: translateY(1px); }
  .btn-row { display: flex; gap: 8px; }
  .btn-row button { flex: 1; }
  .primary {
    background: linear-gradient(135deg, #4d8ef7, #7d6bf0);
    border-color: transparent; color: #fff; font-weight: 600;
  }
  .primary:hover { filter: brightness(1.08); background: linear-gradient(135deg, #4d8ef7, #7d6bf0); }
  .actions button { width: 100%; }
  .actions .primary { margin-top: 8px; }

  /* ---------- Сцена ---------- */
  .stage {
    flex: 1; min-width: 0; padding: 18px; display: flex;
    background:
      radial-gradient(1200px 600px at 70% -10%, #1d222b 0%, #14161a 60%);
  }
  .wrap {
    position: relative; flex: 1; border-radius: 14px; overflow: hidden;
    background-color: #ffffff;
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
    box-shadow: 0 12px 40px rgba(0,0,0,.5), 0 0 0 1px #2a2f38;
  }
  #paint {
    position: absolute; inset: 0; display: block;
    touch-action: none; cursor: crosshair;
  }
  .hint {
    position: absolute; left: 14px; bottom: 12px; font-size: 11.5px;
    color: rgba(0,0,0,.35); pointer-events: none; letter-spacing: .3px;
  }
</style>
</head>
<body>

<div class="app">
  <aside class="panel">
    <h1>Painter</h1>

    <section>
      <h2>Кисть</h2>
      <div class="brushes" id="brushes">
        <button class="brush active" data-i="0"><span class="thumb"></span><span class="num">Кисть 1</span></button>
        <button class="brush" data-i="1"><span class="thumb"></span><span class="num">Кисть 2</span></button>
        <button class="brush" data-i="2"><span class="thumb"></span><span class="num">Кисть 3</span></button>
      </div>
    </section>

    <section>
      <h2>Параметры кисти</h2>

      <div class="ctrl">
        <div class="row"><span>Начальный размер</span><output id="o-start"></output></div>
        <input type="range" id="startSize" min="1" max="300" step="1" value="18">
      </div>

      <div class="ctrl">
        <div class="row"><span>Максимальный размер</span><output id="o-max"></output></div>
        <input type="range" id="maxSize" min="1" max="400" step="1" value="90">
      </div>

      <div class="ctrl">
        <div class="row"><span>Минимальный шаг</span><output id="o-step"></output></div>
        <input type="range" id="minStep" min="0.5" max="40" step="0.5" value="4">
      </div>

      <div class="ctrl">
        <div class="row"><span>Поворот кисти</span><output id="o-rot"></output></div>
        <input type="range" id="rotation" min="-720" max="720" step="5" value="0">
      </div>

      <div class="ctrl">
        <div class="row"><span>Чувствительность к скорости</span><output id="o-sens"></output></div>
        <input type="range" id="sens" min="0" max="100" step="1" value="65">
      </div>
    </section>

    <section>
      <h2>Фон</h2>
      <div class="field">
        <label for="bgColor">Цвет</label>
        <input type="color" id="bgColor" value="#ffffff">
      </div>
      <div class="field">
        <input type="url" id="bgUrl" placeholder="URL изображения https://...">
      </div>
      <div class="btn-row">
        <button id="applyBg">Применить</button>
        <button id="clearBg">Убрать</button>
      </div>
    </section>

    <section class="actions">
      <h2>Действия</h2>
      <button id="clear">Очистить холст</button>
      <button id="save" class="primary">Сохранить PNG</button>
    </section>
  </aside>

  <main class="stage">
    <div class="wrap" id="wrap">
      <canvas id="paint"></canvas>
      <div class="hint">Рисуйте мышью или пальцем — чем быстрее движение, тем толще мазок</div>
    </div>
  </main>
</div>

<script>
(() => {
  'use strict';

  const $ = id => document.getElementById(id);
  const canvas = $('paint');
  const ctx = canvas.getContext('2d');
  const wrap = $('wrap');

  /* =========================================================
     Параметры
     ========================================================= */
  const params = {
    startSize: 18,
    maxSize: 90,
    minStep: 4,
    rotation: 0,
    sens: 65
  };

  const bindings = [
    ['startSize', 'o-start', v => v + ' px'],
    ['maxSize',   'o-max',   v => v + ' px'],
    ['minStep',   'o-step',  v => v + ' px'],
    ['rotation',  'o-rot',   v => v + ' °/100px'],
    ['sens',      'o-sens',  v => v + ' %']
  ];

  bindings.forEach(([id, outId, fmt]) => {
    const el = $(id), out = $(outId);
    const update = () => {
      params[id] = parseFloat(el.value);
      out.textContent = fmt(el.value);
    };
    el.addEventListener('input', update);
    update();
  });

  /* =========================================================
     Кисти: пробуем brush1.png / brush2.png / brush3.png,
     если файла нет — генерируем процедурную кисть.
     ========================================================= */
  const brushFiles = ['brush1.png', 'brush2.png', 'brush3.png'];
  const brushImgs = [null, null, null];
  let currentBrush = 0;

  function makeBrushDataURL(kind) {
    const S = 256;
    const c = document.createElement('canvas');
    c.width = c.height = S;
    const g = c.getContext('2d');
    const cx = S / 2, cy = S / 2, R = S / 2 - 2;

    if (kind === 0) {
      // Мягкая круглая кисть
      const grd = g.createRadialGradient(cx, cy, 0, cx, cy, R);
      grd.addColorStop(0,    'rgba(16,16,22,1)');
      grd.addColorStop(0.45, 'rgba(16,16,22,0.82)');
      grd.addColorStop(0.78, 'rgba(16,16,22,0.28)');
      grd.addColorStop(1,    'rgba(16,16,22,0)');
      g.fillStyle = grd;
      g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.fill();

    } else if (kind === 1) {
      // Жёсткая кисть со щетиной
      g.translate(cx, cy);
      g.lineCap = 'round';
      for (let i = 0; i < 80; i++) {
        const a = Math.random() * Math.PI * 2;
        const len = R * (0.55 + Math.random() * 0.5);
        g.save();
        g.rotate(a);
        g.strokeStyle = 'rgba(10,10,16,' + (0.05 + Math.random() * 0.28).toFixed(3) + ')';
        g.lineWidth = 1.5 + Math.random() * 5;
        g.beginPath();
        g.moveTo(0, 0);
        g.lineTo(len, 0);
        g.stroke();
        g.restore();
      }
      const grd = g.createRadialGradient(0, 0, 0, 0, 0, R * 0.72);
      grd.addColorStop(0, 'rgba(10,10,16,0.92)');
      grd.addColorStop(1, 'rgba(10,10,16,0)');
      g.fillStyle = grd;
      g.beginPath(); g.arc(0, 0, R * 0.72, 0, Math.PI * 2); g.fill();

    } else {
      // Спрей / крапины
      for (let i = 0; i < 1100; i++) {
        const a = Math.random() * Math.PI * 2;
        const rr = Math.pow(Math.random(), 0.55) * R;
        const x = cx + Math.cos(a) * rr;
        const y = cy + Math.sin(a) * rr;
        const rad = 0.5 + Math.random() * 2.6;
        g.fillStyle = 'rgba(12,12,18,' + (0.05 + Math.random() * 0.5).toFixed(3) + ')';
        g.beginPath(); g.arc(x, y, rad, 0, Math.PI * 2); g.fill();
      }
    }
    return c.toDataURL('image/png');
  }

  function loadBrushImage(i) {
    return new Promise(resolve => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => {
        const fb = new Image();
        fb.onload = () => resolve(fb);
        fb.onerror = () => resolve(null);
        fb.src = makeBrushDataURL(i);
      };
      img.src = brushFiles[i];
    });
  }

  Promise.all([0, 1, 2].map(loadBrushImage)).then(imgs => {
    imgs.forEach((img, i) => {
      if (!img) return;
      brushImgs[i] = img;
      const thumb = document.querySelector('.brush[data-i="' + i + '"] .thumb');
      if (thumb) thumb.style.backgroundImage = 'url("' + img.src + '")';
    });
  });

  // Выбор кисти
  document.querySelectorAll('.brush').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.brush').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentBrush = parseInt(btn.dataset.i, 10);
    });
  });

  /* =========================================================
     Размер холста (с учётом devicePixelRatio и сохранением)
     ========================================================= */
  let dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 2));

  function resizeCanvas() {
    const r = wrap.getBoundingClientRect();
    const w = Math.max(1, Math.round(r.width));
    const h = Math.max(1, Math.round(r.height));
    const pw = Math.round(w * dpr);
    const ph = Math.round(h * dpr);
    if (canvas.width === pw && canvas.height === ph) return;

    let snapshot = null;
    if (canvas.width && canvas.height) {
      snapshot = document.createElement('canvas');
      snapshot.width = canvas.width;
      snapshot.height = canvas.height;
      snapshot.getContext('2d').drawImage(canvas, 0, 0);
    }

    canvas.width = pw;
    canvas.height = ph;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';

    if (snapshot) {
      ctx.drawImage(snapshot, 0, 0, snapshot.width / dpr, snapshot.height / dpr);
    }
  }

  resizeCanvas();
  if (window.ResizeObserver) {
    new ResizeObserver(resizeCanvas).observe(wrap);
  } else {
    window.addEventListener('resize', resizeCanvas);
  }

  /* =========================================================
     Рисование
     ========================================================= */
  let drawing = false;
  let lastX = 0, lastY = 0, lastT = 0;
  let acc = 0;          // накопленная дистанция до следующего штампа
  let angle = 0;        // текущий угол кисти
  let smoothSpeed = 0;  // сглаженная скорость (px/ms)

  const SPEED_MIN = 0.10;  // px/ms — ниже скорость не влияет
  const SPEED_MAX = 2.00;  // px/ms — выше скорость максимальна
  const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);

  function getPos(e) {
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  function stamp(x, y, size) {
    const img = brushImgs[currentBrush];
    if (!img) return;
    const half = size / 2;
    ctx.save();
    ctx.translate(x, y);
    if (angle) ctx.rotate(angle * Math.PI / 180);
    ctx.drawImage(img, -half, -half, size, size);
    ctx.restore();
  }

  canvas.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault();
    const p = getPos(e);
    drawing = true;
    lastX = p.x; lastY = p.y;
    lastT = performance.now();
    acc = 0; angle = 0; smoothSpeed = 0;
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    stamp(p.x, p.y, params.startSize);
  });

  canvas.addEventListener('pointermove', e => {
    if (!drawing) return;
    e.preventDefault();

    const p = getPos(e);
    const now = performance.now();
    let dt = now - lastT;
    lastT = now;
    if (dt < 1) dt = 1;
    if (dt > 100) dt = 100;

    const dx = p.x - lastX;
    const dy = p.y - lastY;
    const dist = Math.hypot(dx, dy);
    if (dist < 0.02) return;

    // Скорость и сглаживание
    const instSpeed = dist / dt;
    smoothSpeed = smoothSpeed * 0.6 + instSpeed * 0.4;

    // Влияние скорости (0..1), масштабируется чувствительностью
    let t = clamp((smoothSpeed - SPEED_MIN) / (SPEED_MAX - SPEED_MIN), 0, 1);
    t *= params.sens / 100;

    const size = params.startSize + (params.maxSize - params.startSize) * t;
    const step = Math.max(0.5, params.minStep * (1 + 0.6 * t)); // быстрее -> чуть больше шаг

    const ux = dx / dist, uy = dy / dist;
    let travelled = 0;
    let guard = 0;

    while (acc + (dist - travelled) >= step && guard++ < 6000) {
      const need = step - acc;
      travelled += need;
      acc = 0;
      stamp(lastX + ux * travelled, lastY + uy * travelled, size);
      angle += step * params.rotation / 100;
    }
    acc += dist - travelled;

    lastX = p.x;
    lastY = p.y;
  });

  function endStroke(e) {
    if (!drawing) return;
    drawing = false;
    try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
  }
  canvas.addEventListener('pointerup', endStroke);
  canvas.addEventListener('pointercancel', endStroke);

  /* =========================================================
     Фон
     ========================================================= */
  let bgColor = '#ffffff';
  let bgImg = null;      // загруженный с CORS (для экспорта)
  let bgUrl = '';

  $('bgColor').addEventListener('input', e => {
    bgColor = e.target.value;
    wrap.style.backgroundColor = bgColor;
  });

  function applyBgImage(url) {
    bgUrl = url;
    wrap.style.backgroundImage = 'url("' + url.replace(/"/g, '%22') + '")';
    wrap.style.backgroundSize = 'cover';
    wrap.style.backgroundPosition = 'center';
    wrap.style.backgroundRepeat = 'no-repeat';
  }

  function loadBg(url) {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => { bgImg = img; applyBgImage(url); };
    img.onerror = () => {
      // повторная попытка без CORS — только для отображения
      const img2 = new Image();
      img2.onload = () => { bgImg = null; applyBgImage(url); };
      img2.onerror = () => alert('Не удалось загрузить изображение по этой ссылке.');
      img2.src = url;
    };
    img.src = url;
  }

  $('applyBg').addEventListener('click', () => {
    const url = $('bgUrl').value.trim();
    if (url) loadBg(url);
  });
  $('bgUrl').addEventListener('keydown', e => {
    if (e.key === 'Enter') $('applyBg').click();
  });

  $('clearBg').addEventListener('click', () => {
    bgImg = null; bgUrl = '';
    $('bgUrl').value = '';
    wrap.style.backgroundImage = 'none';
  });

  /* =========================================================
     Очистить / Сохранить
     ========================================================= */
  $('clear').addEventListener('click', () => {
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.restore();
  });

  function drawCover(c, img, W, H) {
    const ir = img.width / img.height;
    const cr = W / H;
    let dw, dh;
    if (ir > cr) { dh = H; dw = H * ir; }
    else { dw = W; dh = W / ir; }
    c.drawImage(img, (W - dw) / 2, (H - dh) / 2, dw, dh);
  }

  $('save').addEventListener('click', () => {
    const W = canvas.width, H = canvas.height;
    const out = document.createElement('canvas');
    out.width = W; out.height = H;
    const octx = out.getContext('2d');

    try {
      octx.fillStyle = bgColor;
      octx.fillRect(0, 0, W, H);
      if (bgImg) drawCover(octx, bgImg, W, H);
      octx.drawImage(canvas, 0, 0);

      out.toBlob(blob => {
        if (!blob) { alert('Не удалось сохранить изображение.'); return; }
        const a = document.createElement('a');
        a.download = 'painting-' + Date.now() + '.png';
        a.href = URL.createObjectURL(blob);
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      }, 'image/png');

    } catch (err) {
      alert('Не удалось сохранить: фоновое изображение загружено с другого домена без CORS-заголовков.\n' +
            'Сохраните холст без фоновой картинки или используйте изображение с того же домена.');
    }
  });

})();
</script>
</body>
</html>
