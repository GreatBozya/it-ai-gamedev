<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coin Runner — Three.js</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; background: #87ceeb;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    user-select: none;
  }
  canvas { display: block; }

  #hud {
    position: fixed; inset: 0; pointer-events: none;
    padding: 18px 24px;
    display: flex; flex-direction: column;
    color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,.55);
  }
  #score { font-size: 30px; font-weight: 800; letter-spacing: .5px; }
  #hint  { margin-top: auto; font-size: 13px; opacity: .8; }

  #overlay {
    position: fixed; inset: 0; z-index: 10; cursor: pointer;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px;
    background: radial-gradient(circle at 50% 40%, rgba(20,40,60,.55), rgba(5,10,20,.85));
    color: #fff; transition: opacity .3s;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  #overlay h1 {
    font-size: clamp(32px, 6vw, 64px); letter-spacing: 4px;
    background: linear-gradient(180deg, #fff, #ffd23f);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  #overlay p { font-size: 16px; opacity: .85; }
  #overlay .key { opacity: .6; font-size: 13px; margin-top: 8px; }
</style>
</head>
<body>

<div id="hud">
  <div id="score">🪙 0</div>
  <div id="hint">WASD — движение · Shift — бег · Space — прыжок · Мышь — камера · Esc — пауза</div>
</div>

<div id="overlay">
  <h1>COIN RUNNER</h1>
  <p>Нажми, чтобы начать</p>
  <div class="key">WASD · Shift · Space · Мышь</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* =========================================================
   НАСТРОЙКИ
   ========================================================= */
const CFG = {
  // --- модель игрока ---
  modelPath: './models/player.glb', // <-- путь к твоей модели
  autoScale: true,                  // подогнать рост модели под 1.8 м
  targetHeight: 1.8,
  modelYawOffset: 0,                // если модель смотрит назад — поставь Math.PI

  // --- движение ---
  walkSpeed: 3.2,
  runSpeed: 8.5,
  accel: 11,
  jumpSpeed: 7.5,
  gravity: 24,

  // --- камера ---
  camDistance: 6.5,
  camHeight: 1.5,
  camSens: 0.0022,

  // --- мир ---
  worldSize: 120,   // половина стороны карты
  coinCount: 60,
  treeCount: 140,
};

/* =========================================================
   РЕНДЕРЕР / СЦЕНА / СВЕТ
   ========================================================= */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fd4f0);
scene.fog = new THREE.Fog(0x9fd4f0, 90, 230);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 600);

const hemi = new THREE.HemisphereLight(0xcfe8ff, 0x4a6b35, 1.1);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff3e0, 2.4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 260;
const SH = 55;
sun.shadow.camera.left = -SH;
sun.shadow.camera.right = SH;
sun.shadow.camera.top = SH;
sun.shadow.camera.bottom = -SH;
sun.shadow.bias = -0.0006;
sun.shadow.normalBias = 0.02;
scene.add(sun, sun.target);

/* =========================================================
   ЗЕМЛЯ
   ========================================================= */
function makeGrassTexture() {
  const size = 256;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');

  ctx.fillStyle = '#5f9440';
  ctx.fillRect(0, 0, size, size);

  for (let i = 0; i < 5000; i++) {
    const x = Math.random() * size;
    const y = Math.random() * size;
    const g = 110 + Math.random() * 70;
    ctx.fillStyle = `rgba(${45 + Math.random() * 45},${g},${45 + Math.random() * 40},0.45)`;
    ctx.fillRect(x, y, 2, 2);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(50, 50);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(CFG.worldSize * 2.5, CFG.worldSize * 2.5),
  new THREE.MeshStandardMaterial({ map: makeGrassTexture(), roughness: 1, metalness: 0 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

/* =========================================================
   ДЕРЕВЬЯ (InstancedMesh)
   ========================================================= */
const treePositions = [];

function createTrees(count) {
  const trunkGeo = new THREE.CylinderGeometry(0.28, 0.45, 3.5, 6);
  trunkGeo.translate(0, 1.75, 0);
  const trunkMat = new THREE.MeshStandardMaterial({ color: 0x6b4a2b, roughness: 1 });

  const leafGeo = new THREE.ConeGeometry(2.0, 4.5, 8);
  leafGeo.translate(0, 5.0, 0);
  const leafMat = new THREE.MeshStandardMaterial({ color: 0x2f7a3a, roughness: 1, flatShading: true });

  const trunks = new THREE.InstancedMesh(trunkGeo, trunkMat, count);
  const leaves = new THREE.InstancedMesh(leafGeo, leafMat, count);
  trunks.castShadow = leaves.castShadow = true;
  trunks.receiveShadow = leaves.receiveShadow = true;

  const m = new THREE.Matrix4();
  const q = new THREE.Quaternion();
  const p = new THREE.Vector3();
  const s = new THREE.Vector3();
  const axisY = new THREE.Vector3(0, 1, 0);

  let placed = 0, guard = 0;
  while (placed < count && guard < count * 80) {
    guard++;
    const lim = CFG.worldSize - 8;
    const x = (Math.random() * 2 - 1) * lim;
    const z = (Math.random() * 2 - 1) * lim;

    if (Math.hypot(x, z) < 14) continue; // свободная зона вокруг спавна

    let ok = true;
    for (const t of treePositions) {
      if ((t.x - x) ** 2 + (t.z - z) ** 2 < 49) { ok = false; break; }
    }
    if (!ok) continue;

    const scale = 0.75 + Math.random() * 0.75;
    p.set(x, 0, z);
    q.setFromAxisAngle(axisY, Math.random() * Math.PI * 2);
    s.set(scale, scale, scale);
    m.compose(p, q, s);

    trunks.setMatrixAt(placed, m);
    leaves.setMatrixAt(placed, m);
    treePositions.push({ x, z, r: 0.55 * scale });
    placed++;
  }

  trunks.count = leaves.count = placed;
  trunks.instanceMatrix.needsUpdate = true;
  leaves.instanceMatrix.needsUpdate = true;
  scene.add(trunks, leaves);
}
createTrees(CFG.treeCount);

/* =========================================================
   ИГРОК
   ========================================================= */
const player = new THREE.Group();
player.position.set(0, 0, 0);
scene.add(player);

let mixer = null;
let actions = {};
let currentAction = null;
let fallbackRig = null;
let animTime = 0;

/* --- загрузка GLTF модели --- */
const loader = new GLTFLoader();

loader.load(
  CFG.modelPath,
  (gltf) => {
    const model = gltf.scene;

    model.traverse((o) => {
      if (o.isMesh) {
        o.castShadow = true;
        o.receiveShadow = true;
        o.frustumCulled = false; // скины часто "пропадают" из-за неверного bounding box
      }
    });

    // авто-масштаб под нужный рост + ноги на уровне y = 0
    if (CFG.autoScale) {
      const box = new THREE.Box3().setFromObject(model);
      const h = box.max.y - box.min.y;
      if (h > 0.0001) {
        const k = CFG.targetHeight / h;
        model.scale.setScalar(k);
        const box2 = new THREE.Box3().setFromObject(model);
        model.position.y -= box2.min.y;
      }
    }

    const holder = new THREE.Group();
    holder.rotation.y = CFG.modelYawOffset;
    holder.add(model);
    player.add(holder);

    /* --- анимации --- */
    mixer = new THREE.AnimationMixer(model);
    const clips = gltf.animations || [];

    const findClip = (keys) => {
      for (const clip of clips) {
        const n = clip.name.toLowerCase().replace(/[^a-z]/g, '');
        for (const k of keys) if (n.includes(k)) return clip;
      }
      return null;
    };

    const clipRest = findClip(['restpose', 'rest', 'idle', 'pose', 'tpose']);
    const clipWalk = findClip(['walking', 'walk']);
    const clipRun  = findClip(['running', 'run']);

    if (clipRest) actions.rest = mixer.clipAction(clipRest);
    if (clipWalk) actions.walk = mixer.clipAction(clipWalk);
    if (clipRun)  actions.run  = mixer.clipAction(clipRun);

    // подстраховка, если каких-то клипов нет
    if (!actions.rest) actions.rest = actions.walk || actions.run;
    if (!actions.walk) actions.walk = actions.rest || actions.run;
    if (!actions.run)  actions.run  = actions.walk || actions.rest;

    Object.values(actions).forEach(a => { if (a) a.setLoop(THREE.LoopRepeat, Infinity); });

    setAnimState('rest', 1);

    console.log('✅ Модель загружена. Клипы:', clips.map(c => c.name).join(', ') || 'нет');
  },
  undefined,
  (err) => {
    console.warn('⚠️ Не удалось загрузить модель, используется заглушка.', err);
    buildFallbackPlayer();
  }
);

/* --- заглушка, если модели нет --- */
function buildFallbackPlayer() {
  const skinMat  = new THREE.MeshStandardMaterial({ color: 0xffcc99, roughness: .85 });
  const clothMat = new THREE.MeshStandardMaterial({ color: 0x3a7bd5, roughness: .8 });
  const pantsMat = new THREE.MeshStandardMaterial({ color: 0x2b3440, roughness: .9 });

  const root = new THREE.Group();

  const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.3, 0.55, 4, 12), clothMat);
  torso.position.y = 1.35;
  torso.castShadow = true;
  root.add(torso);

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.24, 16, 12), skinMat);
  head.position.y = 2.0;
  head.castShadow = true;
  root.add(head);

  const mkLimb = (w, h, mat, x, y) => {
    const pivot = new THREE.Group();
    pivot.position.set(x, y, 0);
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, w), mat);
    mesh.position.y = -h / 2;
    mesh.castShadow = true;
    pivot.add(mesh);
    root.add(pivot);
    return pivot;
  };

  const armL = mkLimb(0.17, 0.7, skinMat, -0.42, 1.65);
  const armR = mkLimb(0.17, 0.7, skinMat,  0.42, 1.65);
  const legL = mkLimb(0.21, 0.9, pantsMat, -0.17, 0.92);
  const legR = mkLimb(0.21, 0.9, pantsMat,  0.17, 0.92);

  root.scale.setScalar(0.9);
  player.add(root);

  fallbackRig = {
    root,
    update(speed, t) {
      const s = Math.min(speed / CFG.runSpeed, 1);
      const freq = 5 + s * 7;
      const amp = 0.12 + s * 0.85;
      const a = Math.sin(t * freq) * amp;
      legL.rotation.x = a;
      legR.rotation.x = -a;
      armL.rotation.x = -a * 0.85;
      armR.rotation.x = a * 0.85;
      root.position.y = Math.abs(Math.sin(t * freq)) * 0.05 * s;
      root.rotation.z = Math.sin(t * freq) * 0.03 * s;
    }
  };
}

/* --- переключение анимаций с кроссфейдом --- */
function setAnimState(name, timeScale = 1) {
  const next = actions[name];
  if (!next) return;

  if (next === currentAction) {
    next.setEffectiveTimeScale(timeScale);
    return;
  }

  next.reset();
  next.setEffectiveWeight(1);
  next.setEffectiveTimeScale(timeScale);
  next.play();

  if (currentAction) next.crossFadeFrom(currentAction, 0.22, false);

  currentAction = next;
}

/* =========================================================
   МОНЕТКИ
   ========================================================= */
const coinGeo = new THREE.CylinderGeometry(0.42, 0.42, 0.09, 20);
coinGeo.rotateX(Math.PI / 2); // ставим "на ребро"

const coinBaseMat = new THREE.MeshStandardMaterial({
  color: 0xffc93c,
  metalness: 0.95,
  roughness: 0.22,
  emissive: 0x9a6a00,
  emissiveIntensity: 0.9,
  transparent: true,
  opacity: 1,
});

const coins = [];
let score = 0;
const scoreEl = document.getElementById('score');

function randomCoinPosition(avoidPlayer = true) {
  const lim = CFG.worldSize - 12;
  let x = 0, z = 0;

  for (let i = 0; i < 60; i++) {
    x = (Math.random() * 2 - 1) * lim;
    z = (Math.random() * 2 - 1) * lim;

    if (avoidPlayer && Math.hypot(x - player.position.x, z - player.position.z) < 18) continue;

    let bad = false;
    for (const t of treePositions) {
      if ((t.x - x) ** 2 + (t.z - z) ** 2 < 6.25) { bad = true; break; }
    }
    if (!bad) break;
  }
  return { x, z };
}

function createCoins(count) {
  for (let i = 0; i < count; i++) {
    const mat = coinBaseMat.clone();
    const mesh = new THREE.Mesh(coinGeo, mat);
    mesh.castShadow = true;

    const pos = randomCoinPosition(false);
    mesh.position.set(pos.x, 1.0, pos.z);

    scene.add(mesh);
    coins.push({ mesh, mat, phase: Math.random() * Math.PI * 2, state: 'idle', pop: 0 });
  }
}
createCoins(CFG.coinCount);

function respawnCoin(coin) {
  const pos = randomCoinPosition(true);
  coin.mesh.position.set(pos.x, 1.0, pos.z);
  coin.mesh.scale.setScalar(1);
  coin.mesh.rotation.y = Math.random() * Math.PI;
  coin.mat.opacity = 1;
  coin.state = 'idle';
  coin.pop = 0;
  coin.mesh.visible = true;
}

/* =========================================================
   ЗВУК ПОДБОРА
   ========================================================= */
let audioCtx = null;
function playPickupSound() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();

    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = 'triangle';
    osc.frequency.setValueAtTime(900, t);
    osc.frequency.exponentialRampToValueAtTime(1750, t + 0.09);

    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.14, t + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);

    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + 0.22);
  } catch (e) { /* игнорируем */ }
}

/* =========================================================
   УПРАВЛЕНИЕ
   ========================================================= */
const keys = Object.create(null);
let yaw = 0;
let pitch = 0.3;
let isLocked = false;

const overlay = document.getElementById('overlay');

addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (e.code === 'Space') e.preventDefault();
});
addEventListener('keyup', (e) => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

addEventListener('mousemove', (e) => {
  if (!isLocked) return;
  yaw -= e.movementX * CFG.camSens;
  pitch += e.movementY * CFG.camSens;
  pitch = clamp(pitch, -0.35, 1.2);
});

function requestLock() {
  renderer.domElement.requestPointerLock?.();
}
overlay.addEventListener('click', requestLock);
renderer.domElement.addEventListener('click', requestLock);

document.addEventListener('pointerlockchange', () => {
  isLocked = document.pointerLockElement === renderer.domElement;
  overlay.classList.toggle('hidden', isLocked);
  if (isLocked && audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
});

/* =========================================================
   ФИЗИКА / ЛОГИКА ИГРОКА
   ========================================================= */
const horizVel = new THREE.Vector3();
let vertVel = 0;
let onGround = true;

const _forward = new THREE.Vector3();
const _right   = new THREE.Vector3();
const _wish    = new THREE.Vector3();
const _target  = new THREE.Vector3();

function updatePlayer(dt) {
  /* --- ввод --- */
  let ix = 0, iz = 0;
  if (keys['KeyW'] || keys['ArrowUp'])    iz += 1;
  if (keys['KeyS'] || keys['ArrowDown'])  iz -= 1;
  if (keys['KeyA'] || keys['ArrowLeft'])  ix -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) ix += 1;

  _forward.set(-Math.sin(yaw), 0, -Math.cos(yaw));
  _right.set(Math.cos(yaw), 0, -Math.sin(yaw));

  _wish.set(0, 0, 0)
    .addScaledVector(_forward, iz)
    .addScaledVector(_right, ix);

  const hasInput = _wish.lengthSq() > 0;
  if (hasInput) _wish.normalize();

  const running = !!(keys['ShiftLeft'] || keys['ShiftRight']);
  const targetSpeed = hasInput ? (running ? CFG.runSpeed : CFG.walkSpeed) : 0;

  _target.copy(_wish).multiplyScalar(targetSpeed);

  const k = 1 - Math.exp(-CFG.accel * dt);
  horizVel.x += (_target.x - horizVel.x) * k;
  horizVel.z += (_target.z - horizVel.z) * k;

  /* --- прыжок и гравитация --- */
  if (keys['Space'] && onGround) {
    vertVel = CFG.jumpSpeed;
    onGround = false;
  }
  vertVel -= CFG.gravity * dt;

  /* --- перемещение --- */
  player.position.x += horizVel.x * dt;
  player.position.z += horizVel.z * dt;
  player.position.y += vertVel * dt;

  if (player.position.y <= 0) {
    player.position.y = 0;
    vertVel = 0;
    onGround = true;
  }

  /* --- границы карты --- */
  const lim = CFG.worldSize - 4;
  player.position.x = clamp(player.position.x, -lim, lim);
  player.position.z = clamp(player.position.z, -lim, lim);

  /* --- столкновение с деревьями --- */
  for (let i = 0; i < treePositions.length; i++) {
    const t = treePositions[i];
    const dx = player.position.x - t.x;
    const dz = player.position.z - t.z;
    const r = t.r + 0.45;
    const d2 = dx * dx + dz * dz;
    if (d2 < r * r && d2 > 0.000001) {
      const d = Math.sqrt(d2);
      player.position.x = t.x + (dx / d) * r;
      player.position.z = t.z + (dz / d) * r;
    }
  }

  /* --- поворот в сторону движения --- */
  const speed = Math.hypot(horizVel.x, horizVel.z);
  if (speed > 0.2) {
    const targetYaw = Math.atan2(horizVel.x, horizVel.z) + CFG.modelYawOffset;
    player.rotation.y = lerpAngle(player.rotation.y, targetYaw, 1 - Math.exp(-14 * dt));
  }

  /* --- анимация --- */
  updateAnimation(speed, dt);
}

function updateAnimation(speed, dt) {
  animTime += dt;

  if (mixer) {
    let name = 'rest';
    let ts = 1;

    if (speed > 0.25) {
      if (speed <= CFG.walkSpeed + 1.0) {
        name = 'walk';
        ts = clamp(speed / CFG.walkSpeed, 0.6, 1.8);
      } else {
        name = 'run';
        ts = clamp(speed / CFG.runSpeed, 0.7, 1.5);
      }
    }
    setAnimState(name, ts);
    mixer.update(dt);
  } else if (fallbackRig) {
    fallbackRig.update(speed, animTime);
  }
}

/* =========================================================
   МОНЕТКИ: АНИМАЦИЯ И СБОР
   ========================================================= */
const _playerCenter = new THREE.Vector3();
const PICKUP_RADIUS = 1.7;

function updateCoins(dt) {
  _playerCenter.set(player.position.x, player.position.y + 1.0, player.position.z);

  for (let i = 0; i < coins.length; i++) {
    const coin = coins[i];

    if (coin.state === 'idle') {
      coin.mesh.rotation.y += dt * 2.2;
      coin.mesh.position.y = 1.0 + Math.sin(animTime * 2 + coin.phase) * 0.14;

      const dx = coin.mesh.position.x - _playerCenter.x;
      const dy = coin.mesh.position.y - _playerCenter.y;
      const dz = coin.mesh.position.z - _playerCenter.z;

      if (dx * dx + dy * dy + dz * dz < PICKUP_RADIUS * PICKUP_RADIUS) {
        coin.state = 'pop';
        coin.pop = 0;
        score++;
        scoreEl.textContent = `🪙 ${score}`;
        playPickupSound();
      }
    } else {
      // эффект "сбора": монетка увеличивается и растворяется
      coin.pop += dt;
      const t = coin.pop / 0.35;

      if (t >= 1) {
        respawnCoin(coin);
      } else {
        coin.mesh.scale.setScalar(1 + t * 1.8);
        coin.mesh.position.y = 1.0 + t * 1.4;
        coin.mesh.rotation.y += dt * 16;
        coin.mat.opacity = 1 - t;
      }
    }
  }
}

/* =========================================================
   КАМЕРА
   ========================================================= */
const _camTarget = new THREE.Vector3();
const _camDesired = new THREE.Vector3();

function updateCamera(dt) {
  _camTarget.set(
    player.position.x,
    player.position.y + CFG.camHeight,
    player.position.z
  );

  const cp = Math.cos(pitch);
  _camDesired.set(
    _camTarget.x + Math.sin(yaw) * cp * CFG.camDistance,
    _camTarget.y + Math.sin(pitch) * CFG.camDistance,
    _camTarget.z + Math.cos(yaw) * cp * CFG.camDistance
  );
  _camDesired.y = Math.max(_camDesired.y, 0.8);

  camera.position.lerp(_camDesired, 1 - Math.exp(-14 * dt));
  camera.lookAt(_camTarget);
}

/* =========================================================
   МИР (солнце следует за игроком)
   ========================================================= */
function updateWorld() {
  sun.position.set(player.position.x + 45, 75, player.position.z + 30);
  sun.target.position.copy(player.position);
  sun.target.updateMatrixWorld();
}

/* =========================================================
   УТИЛИТЫ
   ========================================================= */
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

function lerpAngle(a, b, t) {
  let d = b - a;
  d = Math.atan2(Math.sin(d), Math.cos(d));
  return a + d * t;
}

/* =========================================================
   RESIZE
   ========================================================= */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* =========================================================
   ГЛАВНЫЙ ЦИКЛ
   ========================================================= */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05); // защита от больших скачков

  updatePlayer(dt);
  updateCoins(dt);
  updateCamera(dt);
  updateWorld();

  renderer.render(scene, camera);
}

// стартовая позиция камеры
camera.position.set(0, 3, 8);
animate();
</script>
